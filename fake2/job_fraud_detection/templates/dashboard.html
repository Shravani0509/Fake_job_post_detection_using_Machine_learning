<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .dashboard-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1>Dashboard</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card dashboard-card">
                    <h5>Total Posts Checked</h5>
                    <p>{{ total_posts_checked }}</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card dashboard-card">
                    <h5>Fraudulent Posts</h5>
                    <p>{{ fraudulent_posts }}</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card dashboard-card">
                    <h5>Non-Fraudulent Posts</h5>
                    <p>{{ non_fraudulent_posts }}</p>
                </div>
            </div>
            <div class="col-md-12">
                <div class="card dashboard-card">
                    <h5>Fraud Percentage</h5>
                    <p>{{ fraud_percentage | round(2) }}%</p>
                </div>
            </div>
        </div>
        <a href="{{ url_for('predict_page') }}" class="btn btn-primary">Go to Prediction Page</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
